version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised versions are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: [astro, "@astrojs/*", astro-icon]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      eslint:
        patterns: ["eslint", "@eslint/*", typescript-eslint, "eslint-plugin-*", eslint-config-prettier]
      prettier:
        patterns: [prettier, "prettier-plugin-*"]
      iconify:
        patterns: ["@iconify-json/*"]
    ignore:
      # astro check (@astrojs/check peers typescript ^5 || ^6) and typescript-eslint
      # (<6.1) need the TypeScript 6 API; take 7 once both support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release: compromised versions are
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
